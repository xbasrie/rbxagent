name: Build Windows Executable (.exe)

on:
  push:
    branches: [ main, master ]
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build-tauri:
    permissions:
      contents: write
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install Frontend Dependencies
        run: npm install

      - name: Build Tauri Desktop (.exe / NSIS)
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CI: false
        with:
          args: --verbose
          tagName: v__VERSION__
          releaseName: 'RbxAgent Desktop v__VERSION__'
          releaseBody: 'Automated Windows build with custom LLM settings & StudioMCP loopback.'
          releaseDraft: false
          prerelease: false

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: RbxAgent-Windows-Setup
          path: src-tauri/target/release/bundle/nsis/*.exe
